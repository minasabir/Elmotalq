<header class="bg-white/80 backdrop-blur-md border-b border-gray-100 sticky top-0 z-10">
  <div class="px-6 lg:px-8">
    <div class="flex justify-between items-center h-20">
      <!-- Breadcrumbs / Page Title -->
      <div class="flex items-center space-x-4">
        <div class="flex items-center gap-2 text-sm font-bold">
          <span class="text-gray-400">Dashboard</span>
          <svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
          </svg>
          <span class="text-primary-blue">Overview</span>
        </div>
      </div>

      <!-- Quick Search / Actions -->
      <div class="hidden lg:flex flex-1 max-w-lg mx-12">
        <div class="relative w-full">
          <input type="text"
            class="w-full bg-gray-50 border-none rounded-2xl py-3 pl-12 pr-4 text-sm focus:ring-2 focus:ring-primary-blue/5 transition-all outline-none italic text-gray-400"
            placeholder="Search anything..." />
          <svg class="absolute left-4 top-3.5 w-5 h-5 text-gray-300" fill="none" stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
      </div>

      <!-- Right Side Actions -->
      <div class="flex items-center gap-6">
        <!-- Notifications -->
        <button
          class="relative p-2.5 text-gray-400 hover:text-primary-blue transition-all bg-gray-50 rounded-xl hover:bg-white hover:shadow-lg ring-1 ring-transparent hover:ring-gray-100">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9">
            </path>
          </svg>
          <span class="absolute top-2.5 right-2.5 w-2 h-2 bg-accent-red rounded-full border-2 border-white"></span>
        </button>

        <!-- User Profile Dropdown -->
        <div class="relative">
          <button (click)="toggleDropdown()"
            class="flex items-center gap-3 p-1.5 pr-4 rounded-2xl bg-gray-50 hover:bg-white transition-all ring-1 ring-transparent hover:ring-gray-100 hover:shadow-xl group">
            <div
              class="w-10 h-10 bg-primary-blue rounded-xl flex items-center justify-center shadow-lg shadow-primary-blue/20 group-hover:scale-105 transition-transform">
              <span class="text-white font-black text-lg">
                {{ currentUser?.name?.charAt(0).toUpperCase() || 'A' }}
              </span>
            </div>
            <div class="hidden md:block text-right">
              <span class="block text-sm font-black text-primary-blue leading-none mb-1">
                {{ currentUser?.name || 'Admin User' }}
              </span>
              <span
                class="block text-[10px] text-gray-400 font-bold uppercase tracking-widest leading-none">Administrator</span>
            </div>
            <svg class="w-4 h-4 text-gray-300 group-hover:text-primary-blue transition-colors"
              [ngClass]="{'rotate-180': isDropdownOpen}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>

          <!-- Dropdown Menu -->
          <div *ngIf="isDropdownOpen"
            class="origin-top-right absolute right-0 mt-3 w-64 rounded-3xl shadow-2xl bg-white ring-1 ring-black/5 z-50 p-2 overflow-hidden animate-fade-up">
            <div class="p-4 border-b border-gray-50 mb-2">
              <p class="text-xs font-black text-gray-400 uppercase tracking-widest mb-1">Signed in as</p>
              <p class="text-sm font-bold text-primary-blue">{{ currentUser?.email || 'admin@elmtalq.com' }}</p>
            </div>
            <button (click)="navigateToProfile()"
              class="flex items-center gap-3 w-full text-left px-4 py-3 text-sm font-bold text-gray-600 hover:bg-gray-50 hover:text-primary-blue rounded-2xl transition-all group">
              <div
                class="w-8 h-8 rounded-lg bg-gray-50 group-hover:bg-primary-blue/10 flex items-center justify-center transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
              </div>
              Your Profile
            </button>
            <div class="h-px bg-gray-50 my-2 mx-4"></div>
            <button (click)="logout()"
              class="flex items-center gap-3 w-full text-left px-4 py-3 text-sm font-bold text-accent-red hover:bg-red-50 rounded-2xl transition-all group">
              <div class="w-8 h-8 rounded-lg bg-red-50 flex items-center justify-center transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                  </path>
                </svg>
              </div>
              Sign out
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
