<aside
  class="bg-primary-blue text-white h-full transition-all duration-300 ease-in-out border-r border-white/5 relative shadow-2xl z-20"
  [ngClass]="{ 'w-64': !isCollapsed, 'w-20': isCollapsed }">

  <!-- Sidebar Header -->
  <div class="p-6 border-b border-white/5">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-3" *ngIf="!isCollapsed">
        <div class="w-10 h-10 bg-accent-red rounded-xl flex items-center justify-center shadow-lg shadow-accent-red/20">
          <span class="text-white font-black text-xl">M</span>
        </div>
        <div>
          <span class="font-black text-xl tracking-tight block">المتألق</span>
          <span class="text-[10px] text-white/40 uppercase font-bold tracking-widest leading-none">Admin Panel</span>
        </div>
      </div>

      <button (click)="toggleSidebar()"
        class="p-2 rounded-xl hover:bg-white/5 transition-all focus:outline-none text-white/60 hover:text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
            [attr.d]="isCollapsed ? 'M4 6h16M4 12h16M4 18h16' : 'M6 18L18 6M6 6l12 12'"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Navigation Menu -->
  <nav class="p-4 mt-4">
    <ul class="space-y-3">
      <li *ngFor="let item of menuItems">
        <a [routerLink]="item.route" routerLinkActive="bg-white/10 text-white shadow-lg ring-1 ring-white/20"
          [routerLinkActiveOptions]="{ exact: false }"
          class="flex items-center space-x-4 px-4 py-3.5 rounded-2xl text-white/60 hover:bg-white/5 hover:text-white transition-all duration-300 group"
          [title]="isCollapsed ? item.label + ' - ' + item.description : ''">
          <span class="text-2xl flex-shrink-0 group-hover:scale-110 transition-transform duration-300">{{ item.icon
            }}</span>
          <div class="flex-1 min-w-0" *ngIf="!isCollapsed">
            <div class="font-bold text-sm tracking-wide">{{ item.label }}</div>
            <div class="text-[10px] text-white/30 uppercase font-bold tracking-tighter">{{ item.description }}</div>
          </div>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Sidebar Footer -->
  <div class="absolute bottom-0 left-0 right-0 p-6 bg-primary-blue-dark border-t border-white/5">
    <div class="flex items-center space-x-4" *ngIf="!isCollapsed">
      <div
        class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center border border-white/10 shadow-inner">
        <span class="text-white font-black text-lg">{{ (user?.name || 'A').charAt(0) }}</span>
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-sm font-black truncate">{{ user?.name || 'Admin User' }}</div>
        <div class="text-[10px] text-white/40 truncate font-bold uppercase tracking-wider">{{ user?.email ||
          'admin@elmtalq.com' }}</div>
      </div>
    </div>

    <div class="flex justify-center" *ngIf="isCollapsed">
      <div
        class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center border border-white/10 hover:bg-accent-red transition-colors cursor-pointer group">
        <span class="text-white font-black text-sm group-hover:scale-110 transition-transform">{{ (user?.name ||
          'A').charAt(0) }}</span>
      </div>
    </div>
  </div>
</aside>
