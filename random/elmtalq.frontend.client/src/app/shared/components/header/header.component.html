<header class="bg-white/90 backdrop-blur-md border-b border-gray-100 sticky top-0 z-[100] transition-all duration-300">
    <div class="container mx-auto px-4 md:px-6">
        <div class="flex items-center justify-between h-20 md:h-24">

            <!-- Desktop Navigation (Left) -->
            <nav class="hidden lg:flex items-center gap-8">
                @for (item of navItems; track item.path) {
                <a [routerLink]="item.path" routerLinkActive="text-primary-blue after:scale-x-100"
                    [routerLinkActiveOptions]="{exact: true}"
                    class="relative text-gray-600 hover:text-primary-blue font-bold text-sm tracking-wide transition-colors duration-300 py-2 after:content-[''] after:absolute after:bottom-0 after:left-0 after:w-full after:h-0.5 after:bg-primary-blue after:scale-x-0 after:transition-transform after:duration-300">
                    {{ item.label }}
                </a>
                }
            </nav>

            <!-- Language & Mobile Menu (Middle/Left on Mobile) -->
            <div class="flex items-center gap-4">
                <div
                    class="hidden sm:flex items-center bg-gray-50 rounded-full px-4 py-2 text-xs font-bold text-gray-400 gap-2 border border-gray-100">
                    <span class="hover:text-primary-blue cursor-pointer transition-colors">EN</span>
                    <span class="w-px h-3 bg-gray-200"></span>
                    <span class="text-primary-blue cursor-default">AR</span>
                </div>

                <button class="lg:hidden text-primary-blue p-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16m-7 6h7"></path>
                    </svg>
                </button>
            </div>

            <!-- Brand Logo (Right) -->
            <a routerLink="/" class="flex items-center gap-4 group">
                <div class="text-right flex flex-col justify-center">
                    <h1
                        class="text-2xl md:text-3xl font-extrabold text-primary-blue tracking-tighter leading-none group-hover:text-primary-blue-light transition-colors">
                        المتألق
                    </h1>
                    <span class="text-[9px] md:text-[11px] text-accent-red font-bold uppercase tracking-widest mt-1">
                        لإلحاق العمالة المصرية بالخارج
                    </span>
                </div>
                <div
                    class="relative w-12 h-12 md:w-14 md:h-14 flex items-center justify-center bg-white rounded-2xl shadow-sm border border-gray-50 overflow-hidden group-hover:shadow-md transition-all">
                    <svg viewBox="0 0 100 100" class="w-10 h-10 md:w-12 md:h-12 relative z-10">
                        <path d="M10 50 Q 50 10 90 50" fill="none" stroke="var(--accent-red)" stroke-width="6"
                            stroke-linecap="round" />
                        <path d="M10 65 Q 50 25 90 65" fill="none" stroke="var(--primary-blue)" stroke-width="6"
                            stroke-linecap="round" />
                        <circle cx="50" cy="53" r="12" fill="var(--primary-blue)" />
                    </svg>
                    <div class="absolute inset-0 bg-gradient-to-tr from-gray-50 to-transparent opacity-50"></div>
                </div>
            </a>

        </div>
    </div>
</header>
