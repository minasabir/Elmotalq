<aside class="bg-gray-900 text-white h-full transition-all duration-300 ease-in-out"
        [ngClass]="{ 'w-64': !isCollapsed, 'w-16': isCollapsed }">
  
  <!-- Sidebar Header -->
  <div class="p-4 border-b border-gray-800">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-3" *ngIf="!isCollapsed">
        <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center">
          <span class="text-white font-bold text-sm">E</span>
        </div>
        <span class="font-semibold text-lg">Elmtalq</span>
      </div>
      
      <button
        (click)="toggleSidebar()"
        class="p-2 rounded-lg hover:bg-gray-800 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                [attr.d]="isCollapsed ? 'M4 6h16M4 12h16M4 18h16' : 'M6 18L18 6M6 6l12 12'"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Navigation Menu -->
  <nav class="p-4">
    <ul class="space-y-2">
      <li *ngFor="let item of menuItems">
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-blue-600 text-white"
          [routerLinkActiveOptions]="{ exact: false }"
          class="flex items-center space-x-3 px-3 py-2 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-all duration-200 group"
          [title]="isCollapsed ? item.label + ' - ' + item.description : ''"
        >
          <span class="text-xl flex-shrink-0">{{ item.icon }}</span>
          <div class="flex-1 min-w-0" *ngIf="!isCollapsed">
            <div class="font-medium truncate">{{ item.label }}</div>
            <div class="text-xs text-gray-400 truncate">{{ item.description }}</div>
          </div>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Sidebar Footer -->
  <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-gray-800">
    <div class="flex items-center space-x-3" *ngIf="!isCollapsed">
      <div class="w-8 h-8 bg-gray-600 rounded-full flex items-center justify-center">
        <span class="text-gray-300 font-medium text-sm">A</span>
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-sm font-medium truncate">Admin User</div>
        <div class="text-xs text-gray-400 truncate">admin@elmtalq.com</div>
      </div>
    </div>
    
    <div class="flex justify-center" *ngIf="isCollapsed">
      <div class="w-8 h-8 bg-gray-600 rounded-full flex items-center justify-center">
        <span class="text-gray-300 font-medium text-sm">A</span>
      </div>
    </div>
  </div>
</aside>
